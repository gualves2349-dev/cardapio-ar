<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cardápio em Realidade Aumentada</title>

  <!-- Biblioteca Model Viewer do Google -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #faf6f1;
      color: #333;
    }
    header {
      background: #8b2e3c;
      color: white;
      text-align: center;
      padding: 20px 10px;
    }
    header h1 { margin: 0; font-size: 24px; }
    header p { margin: 5px 0 0; font-size: 14px; opacity: 0.9; }
    main { padding: 15px; max-width: 600px; margin: 0 auto; }
    .item {
      background: white;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 20px;
      overflow: hidden;
    }
    model-viewer {
      width: 100%;
      height: 280px;
      background: #f0e9e0;
    }
    .info { padding: 15px; }
    .info h2 { margin: 0 0 5px; font-size: 20px; }
    .info p { margin: 0 0 10px; font-size: 14px; color: #666; }
    .preco { font-weight: bold; font-size: 18px; color: #8b2e3c; }
    .botao-ar {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      background: #8b2e3c;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>Doce Sabor Café</h1>
    <p>Toque em "Ver na minha mesa" para visualizar o item</p>
  </header>

  <main>

    <!-- ITEM 1: Fatia de bolo -->
    <section class="item">
      <model-viewer
        src="modelos\bolo.glb"
        alt="Fatia de bolo de chocolate"
        ar
        ar-modes="webxr scene-viewer quick-look"
        ar-scale="fixed"
        camera-controls
        auto-rotate
        shadow-intensity="1"
        loading="lazy">
        <button slot="ar-button" class="botao-ar">📱 Ver na minha mesa</button>
      </model-viewer>
      <div class="info">
        <h2>Fatia de Bolo de Chocolate</h2>
        <p>Massa fofinha com cobertura de brigadeiro.</p>
        <span class="preco">R$ 14,00</span>
      </div>
    </section>

    <!-- ITEM 2: Drink -->
    <section class="item">
      <model-viewer
        src="modelos\drink.glb"
        alt="Drink de frutas vermelhas"
        ar
        ar-modes="webxr scene-viewer quick-look"
        ar-scale="fixed"
        camera-controls
        auto-rotate
        shadow-intensity="1"
        loading="lazy">
        <button slot="ar-button" class="botao-ar">📱 Ver na minha mesa</button>
      </model-viewer>
      <div class="info">
        <h2>Drink de Frutas Vermelhas</h2>
        <p>Vodka, morango, framboesa e limão.</p>
        <span class="preco">R$ 28,00</span>
      </div>
    </section>

  </main>

</body>
</html>
